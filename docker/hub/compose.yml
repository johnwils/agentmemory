# Hub deployment: one LAN daemon at /opt/agentmemory on the hub.
# Layout there: compose.yml, agentmemory.env (secrets, not in git), backup.sh, data/, backups/.
services:
  agentmemory:
    image: agentmemory:${AGENTMEMORY_TAG:?set AGENTMEMORY_TAG in .env}
    container_name: agentmemory
    restart: unless-stopped
    ports:
      - "0.0.0.0:3111:3111"
      - "0.0.0.0:3113:3113"
    env_file:
      - ./agentmemory.env
    volumes:
      - ./data:/data   # agentmemory.sqlite + .hmac (the REST secret clients use)
    stop_grace_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
